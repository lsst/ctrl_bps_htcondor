# Set a global default memory limit (in MiB) for the automatic memory scaling
# mechanism. The value, 480 GiB, picked based on the cluster specifications
# available at
#
#     https://s3df.slac.stanford.edu/public/doc/#/batch-compute
memoryLimit: 491520

# Define how to provision resources automatically.
provisioning:
  provisioningNodeCount: 10
  provisioningMaxIdleTime: 900
  provisioningCheckInterval: 600
  provisioningMaxConsecutiveFailures: 10
  provisioningShutdownAllowanceSeconds: 20
  provisioningQueue: "milano"
  provisioningAccountingUser: "rubin:developers"
  provisioningExtraOptions: ""
  provisioningPlatform: "s3df"
  provisioningScript: |
    #!/bin/bash
    set -x

    allocating=1
    failures=0
    max_failures='{provisioningMaxConsecutiveFailures}'

    allocate=("${CTRL_EXECUTE_DIR}/bin/allocateNodes.py" \
      --account '{provisioningAccountingUser}' \
      --auto \
      --node-count '{provisioningNodeCount}' \
      --maximum-wall-clock '{provisioningMaxWallTime}' \
      --glidein-shutdown '{provisioningMaxIdleTime}' \
      --queue '{provisioningQueue}' \
      --nodeset '{nodeset}' \
      {provisioningExtraOptions} \
      '{provisioningPlatform}')

    trap 'allocating=0; test -n "$bgpid" && kill -SIGTERM "$bgpid";' SIGTERM

    echo "$(date -u): starting provisioningJob"
    while (( allocating )); do
      if "${allocate[@]}"; then
        failures=0
      else
        echo "$(date -u): allocatedNodes failed" >&2
        failures=$((failures + 1))
      fi
      if [[ $failures -ge $max_failures ]]; then
        echo "$(date -u): Too many consecutive allocateNodes failures, exiting" >&2
        exit 1
      fi
      sleep {provisioningCheckInterval} &
      bgpid=$!
      wait $bgpid || :
    done

    echo "$(date -u): Shutting down provisioningJob..."
    sleep '{provisioningShutdownAllowanceSeconds}'
    echo "$(date -u): Running FINAL provisioner"
    "${allocate[@]}"
    exit 0
  provisioningScriptConfig: |
    config.platform["{provisioningPlatform}"].user.name="${USER}"
    config.platform["{provisioningPlatform}"].user.home="${HOME}"
  provisioningScriptConfigPath: "${HOME}/.lsst/condor-info.py"

# By default, disable automatic provisioning of resources.
provisionResources: false

# Whether automatic job retries overwrite stdout/stderr of previous attempt.
overwriteJobFiles: true
finalJob:
  overwriteJobFiles: false

# Define the default DAGMan configuration.
wmsConfig:
  # A comma separated list of variable names to add to the DAGMan *.condor.sub
  # file’s getenv option. If set to "TRUE" (a string, not a boolean!), DAGMan
  # will effectively lift all environmental variables from the user's shell
  # environment.
  DAGMAN_MANAGER_JOB_APPEND_GETENV: "TRUE"

  # A boolean flag controlling whether DAGMan should generate submit files for
  # nested DAGs automatically.
  DAGMAN_GENERATE_SUBDAG_SUBMITS: true

# Needs to be true for plain SLAC submissions.
bpsMakeCommand: true


payloadCommand: >
  echo -n BPS Beginning of job commands:\ ;
  /usr/bin/date +%Y-%m-%dT%H:%M:%S.%N%:z;
  {setupEnv}
  logDir={jobLogDir};
  pwd;
  echo -n BPS Before running command:\ ;
  /usr/bin/date +%Y-%m-%dT%H:%M:%S.%N%:z;
  echo ========================================;
  {gwjobCommand};
  ret=$?;
  echo ========================================;
  echo -n BPS After running command:\ ;
  /usr/bin/date +%Y-%m-%dT%H:%M:%S.%N%:z;
  echo Command exited with code: $ret;
  {jobCleanup}
  echo -n BPS End of job commands:\ ;
  /usr/bin/date +%Y-%m-%dT%H:%M:%S.%N%:z;
  exit $ret;


# Job environment setup
softwarePath: "/cvmfs/sw.lsst.eu/almalinux-x86_64/lsst_distrib/{lsstVersion}"

customEnvSetup: ""
setupEnv: >
  unset PYTHONPATH;
  echo Using stack in {softwarePath};
  source {softwarePath}/loadLSST.bash;
  setup lsst_distrib;
  echo -n BPS After setup of lsst_distrib:\ ;
  /usr/bin/date +%Y-%m-%dT%H:%M:%S.%N%:z;
  {customEnvSetup}
  echo -n BPS After custom env setup:\ ;
  /usr/bin/date +%Y-%m-%dT%H:%M:%S.%N%:z;

# Other job variables
jobInitDir: "`pwd`"
jobLogDir: "{jobInitDir}"
jobCleanup: ""

# Special slot on K8 AP node for running preparePayloadWorkflow
site:
  BPS_SUBMIT:
    nodeset: "BPS_SUBMIT"
    bpsUseShared: true
    bpsUseRunTempSpace: false
    softwarePath: "/sdf/group/rubin/sw/w_latest"
