name: build_and_test

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_call:

env:
  UV_FROZEN: "1"
  UV_MANAGED_PYTHON: "1"

jobs:
  formatting:
    uses: lsst/rubin_workflows/.github/workflows/formatting.yaml@main

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0
        with:
          extra-args: --all-files

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        htcondor-version: ["htcondor>=24.0,<24.1", "htcondor>=25.0,<25.1"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Need to clone everything to embed the version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "latest-known"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-packages --all-extras

      - name: List installed packages
        run: |
          uv tree

      - name: Run Test Matrix
        run: >
          uv run --with '${{ matrix.htcondor-version}}' --isolated
          pytest -r a -v
          --cov=python --cov=tests --cov-report=xml --cov-report=term --cov-branch
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  #v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  #v7.1.1
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  test:
    needs: [formatting, pre-commit, test-matrix]

    runs-on: ubuntu-latest
    steps:
      - name: Test Matrix Passed
        run: echo "Testing Matrix has passed."

  pypi:

    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Need to clone everything to embed the version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "latest-known"
          enable-cache: true
          python-version: "3.13"

      - name: Build and create distribution
        run: uv build

      - name: Upload
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_UPLOADS }}
