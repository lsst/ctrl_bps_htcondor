name: build_and_test

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_call:

env:
  UV_FROZEN: "1"
  UV_MANAGED_PYTHON: "1"

jobs:
  formatting:
    uses: lsst/rubin_workflows/.github/workflows/formatting.yaml@main

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        with:
          extra-args: --all-files

  test-matrix:
    needs: [formatting, pre-commit]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        htcondor-version: ["htcondor>=24.0,<24.1", "htcondor>=25.0,<25.1"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Need to clone everything to embed the version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest-known"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-packages --all-extras

      - name: List installed packages
        run: |
          uv tree

      - name: Run Test Matrix
        run: >
          uv run --with '${{ matrix.htcondor-version}}' --isolated
          pytest -r a -v
          --cov=python --cov=tests --cov-report=xml --cov-report=term --cov-branch
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  #v7.0.0
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  #v7.0.0
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  test:
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Test Matrix Passed
        run: echo "Testing Matrix has passed."

  pypi:

    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Need to clone everything to embed the version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest-known"
          enable-cache: true
          python-version: "3.13"

      - name: Build and create distribution
        run: uv build

      - name: Upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_UPLOADS }}
