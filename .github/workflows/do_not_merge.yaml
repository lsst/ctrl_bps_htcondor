name: "Check commits can be merged"
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  do-not-merge-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Check that there are no commits that should not be merged
        uses: gsactions/commit-message-checker@16fa2d5de096ae0d35626443bcd24f1e756cafee  # v2.0.0
        with:
          excludeDescription: "true"  # optional: this excludes the description body of a pull request
          excludeTitle: "true"  # optional: this excludes the title of a pull request
          checkAllCommitMessages: "true"  # optional: this checks all commits associated with a pull request
          accessToken: ${{ secrets.GITHUB_TOKEN }}  # github access token is only required if checkAllCommitMessages is true
          # Check for message indicating that there is a commit that should
          # not be merged.
          pattern: ^(?!DO NOT MERGE)
          flags: "i"
          error: |
            "This step failed because there is a commit containing the text
            'DO NOT MERGE'. Remove this commit from the branch before merging
            or change the commit summary."

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check lockfiles for branches
        shell: bash
        run: |
          FILES=(pyproject.toml uv.lock)
          # The slash can be URI-encoded in uv lock files.
          MATCH="tickets(/|%2F)DM"
          if grep -q -E "$MATCH" "${FILES[@]}"
          then
            echo "Ticket branches found in ${FILES[*]}:"
            grep -n -E "$MATCH" "${FILES[@]}"
            exit 1
          fi
